<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统一认证系统 - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>统一认证系统</h1>
        
        <!-- 登录表单 -->
        <div id="loginSection">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="captchaRow" class="form-group" style="display: none;">
                    <label for="captchaCode">验证码</label>
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <img id="captchaImg" src="" alt="验证码" style="height: 44px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer;" title="点击刷新">
                        <input type="hidden" id="captchaId" value="">
                        <input type="text" id="captchaCode" name="captcha_code" autocomplete="off" placeholder="图中字符（不区分大小写）" style="max-width: 160px;">
                        <button type="button" id="captchaRefresh" tabindex="-1">换一张</button>
                    </div>
                </div>
                <button type="submit">登录</button>
                <div id="error" class="error"></div>
            </form>
            <p id="registerPrompt" style="text-align: center; margin-top: 20px;">
                还没有账号？<a href="#" onclick="showRegister()">立即注册</a>
            </p>
        </div>
        
        <!-- 注册表单 -->
        <div id="registerSection" style="display: none;">
            <form id="registerForm">
                <div class="form-group">
                    <label for="reg_username">用户名</label>
                    <input type="text" id="reg_username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="reg_email">邮箱</label>
                    <input type="email" id="reg_email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="reg_full_name">姓名</label>
                    <input type="text" id="reg_full_name" name="full_name">
                </div>
                <div class="form-group">
                    <label for="reg_password">密码</label>
                    <input type="password" id="reg_password" name="password" required>
                </div>
                <button type="submit">注册</button>
                <div id="reg_error" class="error"></div>
                <div id="reg_success" class="success"></div>
            </form>
            <p style="text-align: center; margin-top: 20px;">
                已有账号？<a href="#" onclick="showLogin()">立即登录</a>
            </p>
        </div>
    </div>
    
    <script src="/static/js/api.js?v=3"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        function showRegister() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
        }
        
        function showLogin() {
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }
        // 系统关闭注册时隐藏「立即注册」入口
        (function() {
            fetch('/api/v1/system/registration-allowed').then(function(r) { return r.json(); }).then(function(data) {
                if (data && data.allowed === false) {
                    var el = document.getElementById('registerPrompt');
                    if (el) el.style.display = 'none';
                }
            }).catch(function() {});
        })();
    </script>
</body>
</html>
